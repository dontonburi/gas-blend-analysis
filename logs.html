<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(async () => {
  const PAGE = "supplier-scorecard", ADMIN = "admin@gas-blend-runs.app";
  const $ = (id) => document.getElementById(id), err = $("signin-error");
  const ask = (note) => { $("gate-note").textContent = note; $("gate-fields").hidden = false; $("password").focus(); };
  let sb;
  try {
    const mem = {}, store = {
      getItem: (k) => { try { return localStorage.getItem(k); } catch (e) { return mem[k] ?? null; } },
      setItem: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { mem[k] = v; } },
      removeItem: (k) => { try { localStorage.removeItem(k); } catch (e) { delete mem[k]; } } };
    sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, { auth: { storage: store, storageKey: "gbr-auth", persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
  } catch (e) { $("gate-note").textContent = "The sign-in service didn't load. Check the connection and refresh."; return; }
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  async function openPage() {
    const { data, error } = await sb.from("page_keys").select("k").eq("name", PAGE).maybeSingle();
    if (error || !data) return false;
    const p = JSON.parse($("payload").textContent);
    const key = await crypto.subtle.importKey("raw", b64(data.k), "AES-GCM", false, ["decrypt"]);
    const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(p.iv) }, key, b64(p.ct)));
    // wait until this page has finished loading, so document.open() replaces it instead of appending to it
    if (document.readyState !== "complete") await new Promise((r) => window.addEventListener("load", r, { once: true }));
    document.open(); document.write(html); document.close();
    return true;
  }
  const { data: s } = await sb.auth.getSession();
  if (s?.session && await openPage().catch(() => false)) return;
  ask(s?.session?.user?.app_metadata?.role === "guest" ? "You're signed in as a guest. This page needs the main password." : "Enter the main password to open this page.");
  $("signin-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector("button[type=submit]"); err.textContent = ""; btn.disabled = true; btn.textContent = "Opening…";
    const { error } = await sb.auth.signInWithPassword({ email: ADMIN, password: $("password").value });
    if (!error && await openPage().catch(() => false)) return;
    btn.disabled = false; btn.textContent = "Open";
    err.textContent = error ? (/invalid login credentials/i.test(error.message) ? "Wrong password. Only the main password opens this page." : `Couldn't reach the sign-in service (${error.message}).`) : "This account can't open the scorecard.";
  });
})();
</script>
