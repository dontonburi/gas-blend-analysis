<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>PACK EXPO 2026 planning (temporary)</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#fbf9f5;--panel:#fff;--ink:#031b27;--body:#5c5c61;--primary:#014583;--sky:#8ae5ff;--pale:#d4f1ff;--sand:#efe7da;--ok:#147a6e;--warn:#c27a12;
 --line:color-mix(in srgb,#5c5c61 18%,transparent);--south:#014583;--north:#7a4a9e;--west:#b4561a;--lake:#147a6e;
 --font:"DM Sans","Helvetica Neue",Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--body);font:16px/1.4 var(--font);padding:0 max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 0 0;font-size:.9rem;flex-wrap:wrap}
.top a{color:var(--primary)}
.badge{background:var(--sand);color:var(--ink);padding:2px 10px;border-radius:999px;font-size:.8rem}
h1{color:var(--ink);font-weight:500;font-size:1.7rem;margin:10px 0 0;text-wrap:balance}
.sub{margin:2px 0 0;font-size:.92rem}
nav{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 10px;display:flex;gap:8px;overflow-x:auto}
nav button{flex:1 0 auto;min-height:48px;padding:6px 16px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;font:inherit;font-weight:500;text-align:left;cursor:pointer}
nav button small{display:block;color:var(--body);font-size:.75rem;font-weight:400}
nav button[aria-selected="true"]{background:var(--primary);color:#fff;border-color:var(--primary)}
nav button[aria-selected="true"] small{color:#fff;opacity:.85}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.meta{display:flex;gap:12px;align-items:center;margin:6px 0 10px;font-size:.88rem;flex-wrap:wrap;justify-content:space-between}
.bar{height:6px;background:var(--line);border-radius:3px;flex:1 1 120px;min-width:80px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);transition:width .2s}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
li{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
li label{display:grid;grid-template-columns:28px 56px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 14px;cursor:pointer;min-height:60px}
li.lunch{background:var(--pale)}li.lunch label{align-items:center}
li input[type=checkbox]{width:26px;height:26px;margin:2px 0 0;accent-color:var(--primary)}
.t{font-family:var(--mono);font-weight:600;font-size:.95rem;padding-top:3px;color:var(--ink)}
.co{font-weight:700;font-size:1.05rem;color:var(--ink)}
.pu{font-size:.9rem;margin-top:1px}
.nt{font-size:.85rem;margin-top:4px;padding:3px 8px;background:var(--bg);border-radius:6px;display:inline-block}
.booth{font-family:var(--mono);font-weight:600;font-size:.95rem;padding:3px 9px;border-radius:6px;border:1.5px solid currentColor;white-space:nowrap;align-self:start;margin-top:2px}
.S{color:var(--south)}.N{color:var(--north)}.W{color:var(--west)}.L{color:var(--lake)}
li.done .co,li.done .pu,li.done .t{opacity:.55;text-decoration:line-through}
.nta{display:block;width:100%;border:0;border-top:1px dashed var(--line);padding:10px 14px 10px 54px;font:inherit;font-size:.92rem;color:var(--ink);background:transparent;resize:vertical;min-height:40px}
.nta::placeholder{color:var(--body);opacity:.6}
.note{margin:16px 0 0;padding:12px 14px;border:1px dashed var(--line);border-radius:12px;font-size:.9rem}.note b{color:var(--ink)}
.ev{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 14px}
.ev .tm{font-family:var(--mono);font-size:.85rem;grid-column:1/-1}
.tag{font-size:.78rem;padding:2px 8px;border-radius:999px;background:var(--sand);color:var(--ink);white-space:nowrap;align-self:start}.tag.paid{background:var(--primary);color:#fff}
.warn{grid-column:1/-1;font-size:.85rem;color:var(--warn)}
button.reset{margin-top:20px;min-height:44px;padding:0 16px;border:1px solid var(--line);background:var(--panel);color:var(--body);border-radius:12px;font:inherit;cursor:pointer}
@media (max-width:520px){li label{grid-template-columns:28px 48px minmax(0,1fr)}.booth{grid-column:3;justify-self:start;margin-top:4px}.nta{padding-left:14px}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><a href="index.html">&larr; Gas Blend Scrap Factor Report</a><span class="badge">Temporary page, remove after Oct 21</span></div>
<h1>PACK EXPO International 2026 planning</h1>
<p class="sub">McCormick Place, Chicago. Oct 18-21, Central time. Sun-Tue 9-5, Wed 9-3.</p>
<nav id="tabs" role="tablist"></nav>
<div id="view"></div>
</div>
<script>

var H={S:['South','S'],N:['North','N'],W:['West','W'],LU:['Lakeside Upper','L'],LL:['Lakeside Lower','L']};
var L='lunch';
var DAYS=[
{k:'sun',n:'Sun',d:'Oct 18',note:'<b>South Hall only.</b> Stops run in booth-number order as a rough walking route; the floor layout is unverified. Kestrel booth comes from a press release, so confirm it.',rows:[
['9:00','Aesus','Sleeve applicator, filling, capping','S','S-1656'],
['9:30','Kestrel / Filtec','PET bottle inspection','S','S-1747','Confirm booth'],
['10:00','Enercon','Induction sealers (38 mm foil seal)','S','S-1766'],
['10:30','Peco InspX','X-ray foreign material and fill checks','S','S-2058'],
['11:00','Mettler Toledo','X-ray and inspection','S','S-2122','Confirm X-ray works on filled liquid bottles'],
['11:30','Polypack','Shrink bundling for 2pk/3pk cans','S','S-2430'],
['12:00',L],
['1:00','Douglas Machine (Minnesota)','Case packing machines; also shrink bundlers and cartoners','S','S-2514','Douglas Machine Inc., the Minnesota company'],
['1:30','Smurfit Westrock','Cartons and corrugated','S','S-2820'],
['2:00','Bizerba','Inspection and weighing','S','S-2958','Confirm X-ray works on filled liquid bottles'],
['2:30','CSI','38 mm dairy closure (38D-KL), cappers','S','S-2930','Booth was S-3430 in past years'],
['3:00','SACMI USA','Compression-moulded closures, sleeve labelers, blow molding','S','S-3439','Listing does not mention compression; ask'],
['3:30','Amcor','Film and rigid packaging','S','S-3500'],
['4:00','Antares Vision','X-ray, leak detection','S','S-4051'],
['4:30','MBC Aerosol','Aerosol filling machinery','S','S-4333','Show closes at 5:00']]},
{k:'mon',n:'Mon',d:'Oct 19',note:'West, then North Hall. Discovery Tour option: Food Processing Equipment, 3:00-4:30, Upper Lakeside ($49, registration needed). Evening: PACK gives BACK reception 5:30-6:30.',rows:[
['9:00','Pamasol','Aerosol filling lines','W','W-29096','Healthcare Packaging Pavilion'],
['9:45','Plastipak','Bottles','W','W-46014'],
['10:30','Atlas Molded Products','Food-grade molding','W','W-32114'],
['11:15','Michelman','Cup coatings','W','W-38022'],
['12:00',L],
['1:00','Packaging Dynamics','Aerosol and dispensing fillers','N','N-5921'],
['1:30','Bericap NA','Closures','N','N-5867'],
['2:00','ALPS Inspection','Inspection','N','N-5439','Confirm X-ray'],
['2:30','Tetra Pak (optional)','Dairy processing','N','N-5731'],
['3:15','Injection molding machines','32-cavity HDPE cap cell with box filling','','','Search the exhibitor directory']]},
{k:'tue',n:'Tue',d:'Oct 20',note:'Asia and China day. Start in Lakeside Upper, then Lakeside Lower, then West. Tour clash: Bottling Line Solutions (South, 9:00-10:30) overlaps Dase-Sing.',rows:[
['9:00','Dase-Sing (Taiwan)','Shrink sleeve machines and film','LU','LU-8849','Top priority of the day'],
['9:45','VTOPS','Filling solutions','LU','LU-8930'],
['10:30','Coexpan','Thermoformed cups, injection molding','LL','LL-10400'],
['11:15','Food & Beverage Processing Zone','Browse','LU','','Zone, no single booth'],
['12:00',L],
['1:00','ACE Packaging (India)','Cups, lids, molding','W','W-36068'],
['2:00','Shrink film suppliers','Sleeve film, e.g. Klockner Pentaplast','','','Search the exhibitor directory'],
['3:00','Other Asian exhibitors','Filter the directory by country','','','Search the exhibitor directory']]},
{k:'wed',n:'Wed',d:'Oct 21',note:'Show closes at 3:00. Revisit, get quotes, and cover the low-priority VFFS stops.',rows:[
['9:00','Proampac','Dairy films','S','S-3589','Moved from Sunday'],
['10:00','Triangle','VFFS, low priority','S','S-1714'],
['10:30','BW Packaging','VFFS, low priority','S','S-2100'],
['11:00','Revisits','Anything flagged earlier','','',''],
['12:00',L],
['1:00','Quotes and follow-ups','Collect contacts, samples, quotes','','','']]},
{k:'ev',n:'Events',d:'Mon-Wed',ev:1},
{k:'pw',n:'Powder',d:'Glitter dosing',pw:1}];
var PW=[
['Spee-Dee Packaging Machinery','S-1647, South Hall','Auger fillers. Vacuum tooling to keep powder in the package, and a split hopper auger filler for quick cleaning. Demos daily at 10, 12, 2 and 4.','Confirmed booth','Closest match to what you asked for. Ask about narrow openings like a 1-inch aerosol neck.'],
['Accutek Packaging Equipment','S-3110, South Hall','Volumetric auger fillers for powders, granules and other dry products.','Confirmed booth','Minimum dose is not stated. Ask.'],
['VTOPS','LU-8930, Lakeside Upper','Auger fillers: P2 PRO fills 5 to 5,000 g by weight, volume or time; PSH-L linear indexing. Samples can be tested live.','Confirmed booth','Fine-powder rating and opening size not stated. Ask.'],
['All-Fill','South Hall, left side near S-1700','Auger and dry-product fillers.','Seen on your map','Booth number not readable. Confirm in the app.'],
['Tecno Fluss (Seven Fluss), Italy','Booth not checked','Dosing for liquid, semi-liquid, dense and doughy products.','Not checked','Listing does not mention powders or glitter.'],
['Elcan Industries','Not checked','Glitter maker. Ask which doser type suits its glitter grades.','Supplier','Not a dosing machine.']];
var EV=[
['Mon','Discovery Tour: Food Processing Equipment (Upper Lakeside)','3:00-4:30 pm','$49, approval','Replaces the injection-molding search'],
['Mon','Discovery Tour: Labels, Labeling and Printing (South)','1:00-2:30 pm','$49, approval','Overlaps 1:00 plan'],
['Mon','Discovery Tour: Cartoning and Multipacking (North)','1:00-2:30 pm','$49, approval','Overlaps 1:00 plan'],
['Mon','PACK gives BACK Reception','5:30-6:30 pm','Networking',''],
['Tue','Discovery Tour: Bottling Line Solutions (South)','9:00-10:30 am','$49, approval','Closest to your yoghurt bottle line. Clashes with Dase-Sing 9:00'],
['Tue','Discovery Tour: Cartoning and Multipacking (South)','1:00-2:30 pm','$49, approval','Overlaps ACE Packaging 1:00'],
['Tue','Women\'s Leadership Network Breakfast','7:30-9:00 am','Networking',''],
['Tue','PACK Challenge Awards','3:00-3:30 pm','Free',''],
['Mon-Wed','Food & Beverage Processing Innovation Stage (Lakeside Upper)','Mon/Tue 10-3:30, Wed 10-12:30','Free',''],
['Mon-Wed','Innovation Stage, Industry Speaks, Sustainability Central','Roughly 10 am to 4 pm; Wed ends by 1 pm','Free','Check the show app for session lists'],
['Mon','Amcor talk, Innovation Stage 2','10:00 am','Free','Polypropylene packaging']];
var KEY='packexpo26-done';var NK='packexpo26-notes';var done={},notes={};try{notes=JSON.parse(localStorage.getItem(NK)||'{}')}catch(e){}
try{done=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
function saveN(){try{localStorage.setItem(NK,JSON.stringify(notes))}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
var cur='sun';try{cur=localStorage.getItem('packexpo26-tab')||'sun'}catch(e){}
function tabs(){var t=document.getElementById('tabs');t.innerHTML=DAYS.map(function(d){
  return '<button role="tab" aria-selected="'+(d.k===cur)+'" data-k="'+d.k+'">'+d.n+'<small>'+d.d+'</small></button>'}).join('');
  t.onclick=function(e){var b=e.target.closest('button');if(!b)return;cur=b.dataset.k;try{localStorage.setItem('packexpo26-tab',cur)}catch(x){}tabs();render()}}
function render(){var d=DAYS.filter(function(x){return x.k===cur})[0],v=document.getElementById('view'),h='';
  if(d.pw){h='<div class="meta">Powder and glitter dosing. I found no source that ranks leaders in glitter dosing, so nothing here is a ranking.</div><ul>'+PW.map(function(e){
    return '<li><div class="ev"><span class="tm">'+esc(e[1])+'</span><span class="co">'+esc(e[0])+'</span><span class="tag">'+esc(e[3])+'</span><span class="pu" style="grid-column:1/-1">'+esc(e[2])+'</span><span class="warn">'+esc(e[4])+'</span></div></li>'}).join('')+'</ul><div class="note"><b>Search the app for:</b> glitter, powder, auger, dry fill, sprinkles, vibratory feeder.</div>';v.innerHTML=h;return}
  if(d.ev){h='<div class="meta">Registration for tours is on the PACK EXPO site and needs approval. Nothing here is booked.</div><ul>'+EV.map(function(e){
    return '<li><div class="ev"><span class="tm">'+esc(e[0])+' &middot; '+esc(e[2])+'</span><span class="co">'+esc(e[1])+'</span><span class="tag'+(e[3].indexOf('$')===0?' paid':'')+'">'+esc(e[3])+'</span>'+(e[4]?'<span class="warn">'+esc(e[4])+'</span>':'')+'</div></li>'}).join('')+'</ul>';
    h+='<div class="note">IoPP: no 2026 IoPP session found. Ask at the show or check iopp.org.</div>';v.innerHTML=h;return}
  var total=0,n=0;d.rows.forEach(function(r,i){if(r[1]!==L){total++;if(done[d.k+i])n++}});
  h='<div class="meta"><span id="cnt">'+n+' of '+total+' visited</span><div class="bar"><i id="fill" style="width:'+(total?n/total*100:0)+'%"></i></div></div><ul>';
  d.rows.forEach(function(r,i){var id=d.k+i,lunch=r[1]===L,c=!!done[id];
    if(lunch){h+='<li class="lunch"><label><span></span><span class="t">'+r[0]+'</span><span><span class="co">Lunch</span><span class="pu"> 1 hour</span></span></label></li>';return}
    var hall=r[3]?H[r[3]]:null;
    h+='<li class="'+(c?'done':'')+'"><label><input type="checkbox" id="c-'+id+'" data-id="'+id+'"'+(c?' checked':'')+'><span class="t">'+r[0]+'</span><span><span class="co">'+esc(r[1])+'</span><div class="pu">'+esc(r[2])+'</div>'+
    (r[5]?'<div class="nt">'+esc(r[5])+'</div>':'')+'</span>'+
    (r[4]?'<span class="booth '+hall[1]+'" title="'+hall[0]+' Hall">'+r[4]+'</span>':(hall?'<span class="booth '+hall[1]+'">'+hall[0]+'</span>':''))+'</label><textarea class="nta" id="n-'+id+'" data-n="'+id+'" rows="1" placeholder="Notes" aria-label="Notes for '+esc(r[1])+'">'+esc(notes[id]||'')+'</textarea></li>'});
  h+='</ul><div class="note">'+d.note+'</div><button class="reset" id="reset">Clear checkmarks for this day</button>';
  v.innerHTML=h;
  v.onchange=function(e){var c=e.target;if(!c.dataset.id)return;if(c.checked)done[c.dataset.id]=1;else delete done[c.dataset.id];save();render()};
  v.oninput=function(e){var t=e.target;if(t.dataset.n){if(t.value)notes[t.dataset.n]=t.value;else delete notes[t.dataset.n];saveN()}};
  document.getElementById('reset').onclick=function(){d.rows.forEach(function(r,i){delete done[d.k+i]});save();render()}}
tabs();render();
</script>
</body>
</html>
